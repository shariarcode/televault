name: Build TeleVault Personal Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Backup custom AndroidManifest & Info.plist
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          cp ios/Runner/Info.plist /tmp/Info.plist.bak
          rm -rf android ios

      - name: Generate clean platform wrapper files
        run: |
          flutter create --project-name televault .
          rm -rf test/widget_test.dart

      - name: Configure AGP 8.3.2, Gradle 8.5, Kotlin 1.9.24 & CompileSdk 36
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.3.2"/g' android/settings.gradle
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle
          fi
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' android/app/build.gradle
          fi
          cat << 'EOF' >> android/build.gradle

          subprojects {
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      freeCompilerArgs += ["-Xskip-metadata-version-check"]
                  }
              }
          }
          EOF

      - name: Restore custom AndroidManifest & Info.plist
        run: |
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          cp /tmp/Info.plist.bak ios/Runner/Info.plist

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload TeleVault APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeleVault-Personal-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
